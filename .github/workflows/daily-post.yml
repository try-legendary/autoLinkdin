name: Daily tech post

on:
  schedule:
    # Weekdays 14:00 UTC - adjust to taste (edit and commit)
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (do not publish)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-tech-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pipeline
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 scripts/run.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/posted.json
          if git diff --cached --quiet; then
            echo "no state changes"
          else
            git commit -m "Record posted story"
            git push
          fi
